name: Security Policy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: github/dependency-review-action@v3
